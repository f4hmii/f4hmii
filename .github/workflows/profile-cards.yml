name: profile cards

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: # edits to the generator re-render the cards; the bot's own commits are ignored
      - "render_cards.py"
      - "scripts/**"
      - "assets/**"
      - "fonts/*.ttf"

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fontTools (provides pyftsubset)
        run: pip install fonttools

      - name: Refresh contribution and repo data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/refresh_data.py

      - name: Render the cards
        run: python3 render_cards.py

      - name: Commit the refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data
          if git diff --staged --quiet; then
            echo "cards are already up to date"
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi
